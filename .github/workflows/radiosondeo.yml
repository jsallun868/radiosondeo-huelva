name: Actualizar radiosondeo Huelva
on:
  workflow_dispatch:
  schedule:
    - cron: '25 1,3,13,15 * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: radiosondeo-pages
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Descargar y representar último sondeo
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python actualizar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  publicar:
    needs: generar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar resultado
        id: deployment
        uses: actions/deploy-pages@v4
